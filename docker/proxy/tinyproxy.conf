User nobody
Group nobody
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 100
LogLevel Connect
DisableViaHeader Yes

# Only the internal Docker networks reach this port (agents have no other route out).
Allow 0.0.0.0/0

# Domain allowlist: one ERE per line, generated by src/proxy.ts (bind-mounted).
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes

# HTTPS only via CONNECT; plain HTTP is still filtered by domain.
ConnectPort 443
