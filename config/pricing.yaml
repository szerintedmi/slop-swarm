# API-equivalent list prices, USD per million tokens. Cost is computed per API request.
# Prompt tokens = fresh input + cache read + cache write. A tier applies to the WHOLE request
# when its prompt size is above `above_prompt_tokens` (highest matching tier wins).
models:
  claude-haiku-5-5:
    provider: anthropic
    per_mtok:
      input: 0.10
      output: 0.50
      cache_read: 0.01        # 0.1x input
      cache_write_5m: 0.125   # 1.25x input
      cache_write_1h: 0.20    # 2x input (subscription traffic uses the 1h TTL)
    tiers:
      - above_prompt_tokens: 100000
        multiplier: 5
    tool_fees_usd:
      web_search: 0.01        # per search ($10 / 1K)
    output_includes_reasoning: true   # thinking tokens are billed inside output_tokens
    # Derived 2026-10-10 from Claude Code's own total_cost_usd (test/fixtures/claude-hi.jsonl).

  gpt-6-luna:
    provider: openai
    per_mtok:
      input: 0.10
      output: 0.50
      cache_read: 0.01        # cached input, 0.1x
      cache_write_5m: 0.125   # 1.25x input; OpenAI bills cache writes for this model
      cache_write_1h: 0.125
    tiers:
      - above_prompt_tokens: 272000   # "long context": whole request at 2x input/cache, 1.5x output
        input_multiplier: 2
        output_multiplier: 1.5
    tool_fees_usd:
      web_search: 0.01        # $10 / 1K calls; search content tokens are billed as normal input
    output_includes_reasoning: true   # verified: total_tokens = input + output (pre-flight §11.5)
    # Source: developers.openai.com/api/docs/models/gpt-6-luna and /api/docs/pricing, checked 2026-10-10.

# Web search through the run's relay (`websearch` in the agent image; src/search.ts). Priced per search,
# not per token: base price for the search type (up to `included_results` results), plus each result
# above that, plus each returned page per content type. The relay asks for highlights only.
# Exa's own costDollars.total is logged beside ours as the cross-check.
search:
  exa-search:
    provider: exa
    per_request_usd:
      auto: 0.007             # $7 / 1K requests (auto and fast, 1-10 results)
      fast: 0.007
    included_results: 10
    per_extra_result_usd: 0.001   # $1 / 1K results above 10
    per_page_usd:             # $1 / 1K pages per content type
      highlights: 0.001       # The pricing page names this price for /contents and summaries only; whether
      text: 0.001             # /search bills highlights is not stated. Counted (worst case) until
      summary: 0.001          # costDollars shows otherwise.
    # Source: exa.ai/pricing and exa.ai/docs/reference/search, checked 2026-10-11.
