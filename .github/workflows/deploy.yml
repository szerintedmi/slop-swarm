# Test, build, deploy (docs/plans/2026-10-12-hosted-control-plane.md §6.4; runbook: docs/deploy.md).
# Secrets (repository → Settings → Secrets, environment `production`):
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET   Tailscale OAuth client allowed to create ephemeral tag:ci nodes
#   DEPLOY_SSH_KEY                        private key whose public half is the VPS's forced-command key
#   VPS_SSH_HOST                          the VPS's tailnet name (MagicDNS), e.g. slopswarm-vps
#   VPS_SSH_KNOWN_HOSTS                   `ssh-keyscan <tailnet name>` output
# Repository variable DEPLOY_ENABLED=true turns on building, pushing and deploying (off until the VPS is set up;
# the tests always run). Nothing here names the public forge domain: it lives in the VPS env file only.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # A cold checkout has no dashboard build; the first service test would otherwise build it inside its timeout.
      - run: bun src/cli.ts ui-build
      - run: bun test
      - run: bun run typecheck

  images:
    needs: test
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      controller: ${{ steps.refs.outputs.controller }}
      agent: ${{ steps.refs.outputs.agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        run: |
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          # A deploy waits for the active run to end when the schema hash changes (deploy/slopswarm-deploy).
          {
            echo "controller=${repo}-controller"
            echo "agent=${repo}-agent"
            echo "schema=$(cat src/db/schema.sql src/db/index.ts | sha256sum | cut -c1-16)"
          } >> "$GITHUB_OUTPUT"
      - id: controller
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/controller.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: SCHEMA_HASH=${{ steps.names.outputs.schema }}
          tags: ${{ steps.names.outputs.controller }}:${{ github.sha }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller
      # The agent image for the VPS's agent hosts (amd64) and the laptop (arm64); runners pull it by digest.
      - id: agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/agent.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.agent }}:${{ github.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      - id: refs
        run: |
          {
            echo "controller=${{ steps.names.outputs.controller }}@${{ steps.controller.outputs.digest }}"
            echo "agent=${{ steps.names.outputs.agent }}@${{ steps.agent.outputs.digest }}"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: deploy by digest
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          # The key's forced command runs slopswarm-deploy; this is its argument line.
          ssh -i ~/.ssh/deploy -o BatchMode=yes "deploy@$HOST" deploy "${{ needs.images.outputs.controller }}" "${{ needs.images.outputs.agent }}"
