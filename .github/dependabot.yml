# Keeps the SHA-pinned actions in .github/workflows current: one grouped PR a week, bumping each SHA and its
# `# vX.Y.Z` comment. Actions stay pinned to commits (a moved tag can't change what runs with the deploy secrets).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
